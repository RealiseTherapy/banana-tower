<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161329">
  <title>Banana Tower</title>
  <style>
    :root { color-scheme: dark; font-family: monospace; background: #100e20; color: #fff3cc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 12px; }
    main { width: min(100%, 800px); text-align: center; }
    h1 { margin: 0 0 7px; color: #ffe568; font-size: clamp(20px, 5vw, 32px); letter-spacing: 3px; text-shadow: 3px 3px #a04448; }
    .frame { border: 4px solid #65547e; box-shadow: 0 0 0 4px #272039, 0 12px 40px #0008; background: #18132a; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; }
    .help { margin: 11px 0 6px; color: #cbbfd3; font-size: 12px; line-height: 1.6; }
    .controls { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    button { font: bold 15px monospace; color: #fff3cc; background: #403553; border: 2px solid #8e7897; border-radius: 4px; padding: 10px 15px; touch-action: none; cursor: pointer; }
    button:active, button.pressed { background: #a35357; transform: translateY(2px); }
    .note { color: #a99bb5; font-size: 11px; margin: 9px 0; }
  </style>
</head>
<body>
<main>
  <h1>BANANA TOWER</h1>
  <div class="frame"><canvas id="game" width="800" height="720" aria-label="Banana Tower game. Climb the ladders to rescue the bananas."></canvas></div>
  <p class="help">← → MOVE &nbsp; ↑ / ↓ CLIMB &nbsp; SPACE JUMP &nbsp; X SLICE &nbsp; ENTER START / RESTART</p>
  <div class="controls" aria-label="Touch controls">
    <button data-key="ArrowLeft" aria-label="Move left">◀</button>
    <button data-key="ArrowRight" aria-label="Move right">▶</button>
    <button data-key="ArrowUp" aria-label="Climb up">▲</button>
    <button data-key="ArrowDown" aria-label="Climb down">▼</button>
    <button data-key="Space">JUMP</button>
    <button data-key="KeyX">SLICE</button>
    <button data-key="Enter">START</button>
  </div>
  <p class="note">Two hits cost a life. Peels drop you a floor. Grab the katana on floor 2!</p>
</main>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const W = 800, H = 720, LEFT = 70, RIGHT = 730, FLOORS = 7;
  const keys = new Set(), pressed = new Set();
  const floorY = (floor, x) => 635 - floor * 75 + (floor % 2 === 0 ? 1 : -1) * (400 - x) * 0.035;
  const ladderX = floor => floor % 2 === 0 ? 700 : 100;
  const random = (a, b) => a + Math.random() * (b - a);
  let state = "title", player, hazards, lives, hits, sword, spawnTimer, peelTimer, elapsed, deathTimer, danceTimer, notice, noticeTimer;

  function resetRun() {
    lives = 5; hits = 0; sword = false; hazards = [];
    spawnTimer = 1.3; peelTimer = 4; elapsed = 0; deathTimer = 0; danceTimer = 0;
    notice = ""; noticeTimer = 0;
    resetPlayer();
    state = "playing";
  }
  function resetPlayer() {
    player = { x: 110, floor: 0, jump: 0, vy: 0, facing: 1, invulnerable: 1.5, attack: 0, climb: null, fall: null };
  }
  function flash(text) { notice = text; noticeTimer = 2; }
  function watermelon() {
    const floor = Math.floor(random(0, FLOORS));
    const direction = floor % 2 === 0 ? -1 : 1;
    hazards.push({ type: "melon", floor, x: direction < 0 ? RIGHT - 4 : LEFT + 4, direction, speed: random(75, 110) + floor * 3, angle: 0 });
  }
  function peel() {
    const floor = Math.floor(random(0, FLOORS));
    hazards.push({ type: "peel", floor, x: random(155, 645), age: 0 });
  }
  function playerY() {
    if (player.climb) {
      const { from, to, t, x } = player.climb;
      return floorY(from, x) + (floorY(to, x) - floorY(from, x)) * t;
    }
    if (player.fall) {
      const { from, to, t, x } = player.fall;
      return floorY(from, x) + (floorY(to, x) - floorY(from, x)) * t;
    }
    return floorY(player.floor, player.x) - player.jump;
  }
  function hitPlayer() {
    if (player.invulnerable > 0) return;
    hits++;
    player.invulnerable = 1.5;
    if (hits >= 2) {
      lives--;
      state = "dying";
      deathTimer = 0; danceTimer = 0;
    } else flash("OUCH! ONE HIT LEFT");
  }
  function update(dt) {
    if (pressed.has("Enter") && state !== "playing" && state !== "dying") resetRun();
    if (state === "dying" || state === "gameover") danceTimer += dt;
    if (state === "dying") {
      deathTimer += dt;
      if (deathTimer >= 1.7) {
        if (lives <= 0) state = "gameover";
        else {
          hits = 0; hazards = []; sword = false; spawnTimer = 1.4; peelTimer = 4;
          resetPlayer(); state = "playing"; flash("TRY AGAIN!");
        }
      }
      return;
    }
    if (state !== "playing") return;
    elapsed += dt;
    noticeTimer = Math.max(0, noticeTimer - dt);
    player.invulnerable = Math.max(0, player.invulnerable - dt);
    player.attack = Math.max(0, player.attack - dt);
    if (pressed.has("KeyX") && sword && player.attack <= 0) player.attack = 0.25;
    if (player.climb) {
      player.climb.t += dt * 1.6;
      if (player.climb.t >= 1) {
        player.floor = player.climb.to;
        player.climb = null;
      }
    } else if (player.fall) {
      player.fall.t += dt * 2.5;
      if (player.fall.t >= 1) {
        player.floor = player.fall.to;
        player.fall = null;
        player.invulnerable = Math.max(player.invulnerable, 0.6);
      }
    } else {
      const move = (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
      if (move) { player.x = Math.max(LEFT + 10, Math.min(RIGHT - 10, player.x + move * 155 * dt)); player.facing = move; }
      if (pressed.has("Space") && player.jump === 0) player.vy = 290;
      if (player.jump > 0 || player.vy > 0) {
        player.jump += player.vy * dt;
        player.vy -= 700 * dt;
        if (player.jump <= 0) { player.jump = 0; player.vy = 0; }
      }
      if (player.jump === 0) {
        if ((keys.has("ArrowUp") || keys.has("KeyW")) && player.floor < FLOORS - 1 && Math.abs(player.x - ladderX(player.floor)) < 22) {
          const x = ladderX(player.floor);
          player.x = x; player.climb = { from: player.floor, to: player.floor + 1, x, t: 0 };
        } else if ((keys.has("ArrowDown") || keys.has("KeyS")) && player.floor > 0 && Math.abs(player.x - ladderX(player.floor - 1)) < 22) {
          const x = ladderX(player.floor - 1);
          player.x = x; player.climb = { from: player.floor, to: player.floor - 1, x, t: 0 };
        }
      }
      if (!sword && player.floor === 1 && Math.abs(player.x - 400) < 24 && player.jump < 30) {
        sword = true; flash("KATANA FOUND! PRESS X");
      }
      if (player.floor === 6 && player.x > 660 && player.jump < 35) state = "won";
    }
    spawnTimer -= dt; peelTimer -= dt;
    if (spawnTimer <= 0) { watermelon(); spawnTimer = Math.max(0.65, 1.35 - elapsed / 300); }
    if (peelTimer <= 0) { peel(); peelTimer = random(3, 5); }
    for (const h of hazards) {
      if (h.type === "melon") { h.x += h.direction * h.speed * dt; h.angle += dt * h.direction * 5; }
      else h.age += dt;
      if (h.floor !== player.floor || player.climb || player.fall) continue;
      if (h.type === "melon" && player.attack > 0 && player.jump < 35 &&
          (h.x - player.x) * player.facing > -4 && (h.x - player.x) * player.facing < 48) {
        h.remove = true;
      } else if (Math.abs(h.x - player.x) < (h.type === "melon" ? 22 : 18) && player.jump < (h.type === "melon" ? 30 : 12)) {
        if (h.type === "melon") { if (player.invulnerable <= 0) { h.remove = true; hitPlayer(); } }
        else {
          h.remove = true;
          if (player.floor > 0) {
            player.fall = { from: player.floor, to: player.floor - 1, x: player.x, t: 0 };
            flash("SLIPPERY!");
          } else flash("SLIPPERY!");
        }
      }
    }
    hazards = hazards.filter(h => !h.remove && h.x > LEFT - 25 && h.x < RIGHT + 25 && (h.type !== "peel" || h.age < 13));
  }
  function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function text(str, x, y, size, color, align = "left") {
    ctx.fillStyle = color; ctx.font = `bold ${size}px monospace`; ctx.textAlign = align; ctx.fillText(str, x, y);
  }
  function drawBackground() {
    rect(0, 0, W, H, "#18152b");
    for (let row = 0; row < 14; row++) {
      for (let col = 0; col < 13; col++) {
        const x = col * 68 + (row % 2) * 34, y = 55 + row * 49;
        rect(x, y, 65, 46, (row + col) % 3 === 0 ? "#252039" : "#211c34");
        rect(x + 4, y + 5, 14, 3, "#2c2641");
      }
    }
    rect(38, 90, 18, 580, "#3d3049"); rect(744, 90, 18, 580, "#3d3049");
    for (let f = 0; f < FLOORS - 1; f++) {
      const x = ladderX(f), top = floorY(f + 1, x), bottom = floorY(f, x);
      rect(x - 11, top, 4, bottom - top, "#b38a58"); rect(x + 7, top, 4, bottom - top, "#b38a58");
      for (let y = top + 8; y < bottom; y += 14) rect(x - 10, y, 20, 4, "#dfb779");
    }
    for (let f = 0; f < FLOORS; f++) {
      for (let x = LEFT; x < RIGHT; x += 8) {
        const y = floorY(f, x);
        rect(x, y, 9, 12, "#a54954");
        rect(x, y, 9, 4, "#e07d70");
        if ((x - LEFT) % 32 === 0) rect(x + 3, y + 6, 3, 3, "#f5b09b");
      }
      text(String(f + 1), 48, floorY(f, 80) - 6, 13, "#a99ab1", "center");
    }
  }
  function drawBananas(x, y) {
    rect(x, y, 42, 25, "#64402e"); rect(x + 3, y + 4, 36, 16, "#9a6840");
    rect(x + 4, y - 10, 7, 12, "#ffe15c"); rect(x + 8, y - 3, 20, 6, "#ffe15c");
    rect(x + 25, y - 12, 6, 14, "#f8c943"); rect(x + 30, y - 7, 8, 6, "#f8c943");
    rect(x + 8, y - 12, 4, 4, "#986b38");
  }
  function drawVillain(x, y) {
    if (state === "dying" || state === "gameover") {
      const pose = Math.floor(danceTimer * 5) % 4;
      const bounce = pose % 2 ? -5 : 0;
      ctx.save();
      ctx.translate(x + (pose < 2 ? -5 : 5), y + bounce);
      ctx.rotate(pose % 2 ? 0.18 : -0.18);
      rect(-12, -51, 24, 6, "#dd4449"); rect(-17, -45, 31, 5, "#a82e3b");
      rect(-9, -40, 20, 15, "#e5aa80"); rect(6, -37, 4, 4, "#262030");
      rect(-13, -25, 27, 19, "#d83e48");
      rect(-22, pose < 2 ? -34 : -19, 10, 5, "#d83e48");
      rect(-26, pose < 2 ? -39 : -14, 6, 8, "#e5aa80");
      rect(14, pose < 2 ? -19 : -34, 10, 5, "#d83e48");
      rect(22, pose < 2 ? -14 : -39, 6, 8, "#e5aa80");
      rect(pose % 2 ? -16 : -10, -6, 9, 8, "#3f3048");
      rect(pose % 2 ? 5 : 11, -6, 9, 8, "#3f3048");
      ctx.restore();
      return;
    }
    rect(x - 12, y - 51, 24, 6, "#dd4449"); rect(x - 17, y - 45, 31, 5, "#a82e3b");
    rect(x - 9, y - 40, 20, 15, "#e5aa80"); rect(x + 6, y - 37, 4, 4, "#262030");
    rect(x - 13, y - 25, 27, 19, "#d83e48"); rect(x - 18, y - 22, 6, 15, "#e5aa80");
    rect(x + 14, y - 24, 6, 12, "#e5aa80");
    rect(x - 11, y - 6, 9, 8, "#3f3048"); rect(x + 4, y - 6, 9, 8, "#3f3048");
  }
  function drawMonkey(x, y) {
    ctx.save(); ctx.translate(Math.round(x), Math.round(y));
    if (state === "dying") ctx.rotate(deathTimer * 12);
    if (player.facing < 0) ctx.scale(-1, 1);
    if (player.invulnerable > 0 && state === "playing" && Math.floor(player.invulnerable * 10) % 2) ctx.globalAlpha = 0.45;
    rect(-15, -20, 5, 12, "#a66b42"); rect(-20, -23, 8, 5, "#a66b42");
    rect(-11, -25, 22, 22, "#9c603b"); rect(-6, -20, 13, 13, "#d6a06a");
    rect(-13, -39, 25, 18, "#a86a41"); rect(6, -34, 10, 11, "#d6a06a");
    rect(-17, -35, 7, 9, "#d6a06a"); rect(8, -33, 3, 3, "#241c2a");
    rect(-9, -4, 8, 5, "#74472f"); rect(3, -4, 9, 5, "#74472f");
    if (player.attack > 0) {
      rect(10, -21, 10, 5, "#d6a06a"); rect(20, -25, 5, 12, "#c8a75e");
      rect(25, -22, 27, 4, "#eff8f5"); rect(49, -25, 5, 4, "#eff8f5");
    } else if (sword) { rect(-14, -25, 4, 19, "#c7d7d4"); rect(-16, -24, 8, 3, "#d4ab56"); }
    ctx.restore();
  }
  function drawHazard(h) {
    const y = floorY(h.floor, h.x);
    if (h.type === "peel") {
      rect(h.x - 3, y - 10, 6, 8, "#ffe567");
      rect(h.x - 13, y - 5, 11, 4, "#f4c740"); rect(h.x + 3, y - 5, 11, 4, "#f4c740");
      rect(h.x - 1, y - 12, 3, 3, "#9d7433");
    } else {
      ctx.save(); ctx.translate(Math.round(h.x), Math.round(y - 13)); ctx.rotate(h.angle);
      rect(-13, -10, 26, 20, "#3eae68"); rect(-10, -13, 20, 26, "#4fc779");
      rect(-7, -10, 4, 20, "#287c50"); rect(4, -10, 4, 20, "#287c50");
      ctx.restore();
    }
  }
  function overlay(title, lines, color = "#ffe568") {
    rect(100, 245, 600, 200, "#100e20"); rect(106, 251, 588, 188, "#30243b");
    text(title, 400, 300, 30, color, "center");
    lines.forEach((line, i) => text(line, 400, 335 + i * 25, 15, "#fff1d0", "center"));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (state === "dying") {
      ctx.translate(W / 2, H / 2);
      ctx.rotate(Math.sin(deathTimer * 3) * Math.min(deathTimer * 0.2, 0.25));
      ctx.translate(-W / 2, -H / 2);
    }
    drawBackground();
    drawBananas(675, floorY(6, 700) - 27);
    drawVillain(590, floorY(6, 590));
    if (!sword) {
      const y = floorY(1, 400);
      rect(395, y - 28, 4, 20, "#e9f4e9"); rect(392, y - 10, 11, 4, "#e3bc5e"); rect(396, y - 7, 3, 7, "#7b5145");
    }
    for (const h of hazards || []) drawHazard(h);
    if (player) {
      if (state === "dying") {
        const blend = Math.min(deathTimer * 3, 1);
        const orbitX = 400 + Math.cos(deathTimer * 7) * 210;
        const orbitY = 360 + Math.sin(deathTimer * 7) * 200;
        drawMonkey(player.x + (orbitX - player.x) * blend, playerY() + (orbitY - playerY()) * blend);
      } else drawMonkey(player.x, playerY());
    }
    ctx.restore();
    rect(0, 0, W, 50, "#100e20");
    text("LIVES " + (player ? lives : 5), 22, 30, 18, "#ffe568");
    text("HITS " + (player ? hits : 0) + "/2", 190, 30, 18, "#ff9e97");
    text(sword ? "KATANA READY" : "FIND THE KATANA", 400, 30, 16, sword ? "#a3f2d1" : "#bfb2c8", "center");
    text("FLOOR " + (player ? player.floor + 1 : 1) + "/7", 775, 30, 18, "#ffe568", "right");
    if (noticeTimer > 0 && state === "playing") text(notice, 400, 78, 16, "#fff0a5", "center");
    if (state === "title") overlay("RESCUE THE BANANAS!", ["Climb 7 floors and dodge rolling watermelons.", "Peels make you slip; two hits cost a life.", "Press ENTER or START to play"]);
    if (state === "gameover") overlay("GAME OVER", ["The bananas remain trapped...", "Press ENTER or START to try again"], "#ff8e88");
    if (state === "won") overlay("BANANAS RESCUED!", ["You made it to the top of the tower!", "Press ENTER or START to play again"]);
  }
  const handled = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyX", "Enter", "KeyW", "KeyA", "KeyS", "KeyD"]);
  function keyDown(code) { if (!keys.has(code)) pressed.add(code); keys.add(code); }
  function keyUp(code) { keys.delete(code); }
  window.addEventListener("keydown", e => { if (handled.has(e.code)) { e.preventDefault(); keyDown(e.code); } });
  window.addEventListener("keyup", e => { if (handled.has(e.code)) { e.preventDefault(); keyUp(e.code); } });
  window.addEventListener("blur", () => { keys.clear(); pressed.clear(); });
  document.querySelectorAll("button[data-key]").forEach(button => {
    const code = button.dataset.key;
    button.addEventListener("pointerdown", e => { e.preventDefault(); button.setPointerCapture(e.pointerId); button.classList.add("pressed"); keyDown(code); });
    const release = () => { button.classList.remove("pressed"); keyUp(code); };
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
  });
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    update(dt); pressed.clear(); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
